name: Publish dev preview

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-main-writes
  cancel-in-progress: false

jobs:
  publish-dev-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-site

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dev-site/package-lock.json

      - name: Install dependencies
        working-directory: dev-site
        run: npm ci

      - name: Check data contracts and build TypeScript site
        working-directory: dev-site
        run: |
          npm test
          npm run build

      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-site

      - name: Copy dev site into preview folder
        run: |
          rm -rf production-site/dev
          mkdir -p production-site/dev
          rsync -av --delete dev-site/dist/ production-site/dev/

      - name: Commit preview update
        working-directory: production-site
        run: |
          if [[ -n "$(git status --porcelain dev)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dev
            git commit -m "Publish dev preview"
            git push origin HEAD:main
          else
            echo "Dev preview is already up to date."
          fi
